<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DatasheetXML — Machine-Readable Electronic Component Datasheets</title>
  <meta name="author" content="Shishir Dey">
  <meta name="description" content="DatasheetXML is a vendor-neutral, machine-readable XML standard for electronic component datasheets, covering identification, electrical, mechanical, thermal, environmental, commercial, and other component specifications.">
  <meta name="keywords" content="DatasheetXML, electronic components, component datasheet, XML schema, XSD, CDD, IEC 61360, EDA, PLM, machine-readable datasheet, resistor, capacitor, integrated circuit">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" id="theme-color-meta" content="#f3e4c5">
  <link rel="canonical" href="{{SITE_URL}}">

  <meta property="og:title" content="DatasheetXML — Electronic Component Datasheet Standard">
  <meta property="og:description" content="A vendor-neutral, schema-validated and machine-readable format for datasheets covering any electronic component.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{SITE_URL}}">
  <meta property="og:site_name" content="DatasheetXML">
  <meta property="article:author" content="Shishir Dey">
  <meta property="article:section" content="Technical specification">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DatasheetXML — Electronic Component Datasheet Standard">
  <meta name="twitter:description" content="A vendor-neutral, schema-validated and machine-readable format for electronic component datasheets.">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "DatasheetXML: A Vendor-Neutral, Machine-Readable Format for Electronic Component Datasheets",
    "description": "A schema-validated XML standard for datasheets covering any electronic or electromechanical component.",
    "version": "{{SPEC_VERSION}}",
    "author": {
      "@type": "Person",
      "name": "Shishir Dey"
    },
    "url": "{{SITE_URL}}",
    "codeRepository": "{{REPOSITORY_URL}}",
    "keywords": ["DatasheetXML", "electronic components", "XML Schema", "CDD", "EDA", "machine-readable datasheets"]
  }
  </script>

  <style>
    :root {
      color-scheme: light;
      --bg-base: #f3e4c5;
      --page-bg:
        radial-gradient(
          circle at 18% 10%,
          rgba(255, 248, 228, 0.82) 0%,
          rgba(215, 161, 72, 0.2) 34%,
          transparent 56%
        ),
        linear-gradient(155deg, #fbf7ef 0%, #f3e4c5 44%, #f1eadc 68%, #ffffff 100%);
      --surface: #fffefa;
      --surface-raised: #f7f0e3;
      --border: rgba(142, 92, 35, 0.16);
      --text: #0f172a;
      --muted: #334155;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --code: #f4ecdc;
      --shadow: 0 8px 20px rgba(92, 57, 16, 0.08);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-base: #254666;
      --page-bg:
        radial-gradient(
          circle at 86% 14%,
          rgba(215, 230, 247, 0.44) 0%,
          rgba(137, 176, 214, 0.24) 30%,
          transparent 54%
        ),
        linear-gradient(155deg, #172c45 0%, #254666 44%, #345f82 76%, #172c45 100%);
      --surface: #243a52;
      --surface-raised: #2b465f;
      --border: rgba(215, 230, 247, 0.18);
      --text: #e2e8f0;
      --muted: #cbd5e1;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.16);
      --code: #20364d;
      --shadow: 0 8px 20px rgba(6, 16, 31, 0.34);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-base);
      background-image: var(--page-bg);
      background-attachment: fixed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 18px;
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 15.5px;
      line-height: 1.62;
      letter-spacing: -0.004em;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .page {
      position: relative;
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 44px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .site-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .control {
      display: inline-flex;
      min-width: 40px;
      height: 38px;
      padding: 0 12px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 600 0.86rem/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .control:hover,
    .control:focus-visible {
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
      text-decoration: none;
    }

    .control svg { width: 17px; height: 17px; }

    .theme-icon-sun { display: none; }
    [data-theme="dark"] .theme-icon-moon { display: none; }
    [data-theme="dark"] .theme-icon-sun { display: block; }

    .markdown-body > div[align="center"] {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body > div[align="center"] h3,
    .markdown-body > div[align="center"] h3 strong,
    .markdown-body > div[align="center"] p strong {
      font-weight: 400;
    }

    .author-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .markdown-body > div[align="center"] .author-line strong {
      font-weight: 700;
    }

    .author-links {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .author-link {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .author-link:hover,
    .author-link:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
      text-decoration: none;
    }

    .author-link svg { width: 15px; height: 15px; }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.016em;
      scroll-margin-top: 20px;
    }

    h1 { margin: 0.2em 0 0.35em; font-size: clamp(2rem, 6vw, 2.7rem); }
    h2 { margin: 2em 0 0.9em; padding-bottom: 0.48em; border-bottom: 1px solid var(--border); font-size: 1.62rem; }
    h3 { margin: 1.55em 0 0.7em; font-size: 1.22rem; }
    h4 { margin: 1.4em 0 0.6em; font-size: 1.05rem; }

    p, li { color: var(--muted); }
    strong { color: var(--text); }
    hr { margin: 32px 0; border: 0; border-top: 1px solid var(--border); }
    img { max-width: 100%; height: auto; }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover { text-decoration-thickness: 2px; }

    blockquote {
      margin: 20px 0;
      padding: 4px 18px;
      background: var(--surface-raised);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
    }

    ul, ol { padding-left: 1.45rem; }
    li + li { margin-top: 0.28rem; }
    input[type="checkbox"] { accent-color: var(--accent); }

    .table-wrapper {
      margin: 20px 0;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    table { width: 100%; border-collapse: collapse; background: var(--surface-raised); }
    th, td { padding: 12px 14px; color: var(--muted); text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--accent-soft); }

    code, pre {
      font-family: "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    code {
      padding: 0.16em 0.38em;
      color: var(--text);
      background: var(--surface-raised);
      border-radius: 5px;
      font-size: 0.88em;
    }

    pre {
      margin: 20px 0;
      padding: 18px 20px;
      overflow-x: auto;
      color: var(--text);
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.55;
    }

    pre code { padding: 0; background: transparent; font-size: inherit; }

    ::selection { background: var(--accent-soft); }

    @media (max-width: 700px) {
      body { padding: 16px 12px; }
      .page { width: 100%; padding: 20px 16px 24px; border-radius: 16px; }
      .site-controls { margin-bottom: 12px; }
      h2 { font-size: 1.35rem; }
      h3 { font-size: 1.08rem; }
      th, td { padding: 10px; font-size: 0.88rem; }
      pre { margin-inline: -4px; padding: 14px; font-size: 0.78rem; }
    }

    @media print {
      .site-controls { display: none; }
      body, .page { background: white; color: black; }
      body { padding: 0; }
      .page { width: 100%; margin: 0; padding: 0; border: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="site-controls" aria-label="Page controls">
      <button class="control" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <a class="control" href="{{REPOSITORY_URL}}" target="_blank" rel="noopener noreferrer" aria-label="View DatasheetXML on GitHub" title="View source on GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 3.8c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </nav>
    <article class="markdown-body">
{{CONTENT}}
    </article>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const themeColor = document.getElementById("theme-color-meta");

    const authorName = [...document.querySelectorAll('.markdown-body > div[align="center"] strong')]
      .find((element) => element.textContent.trim() === "Author: Shishir Dey");

    if (authorName) {
      authorName.parentElement.classList.add("author-line");
      authorName.insertAdjacentHTML(
        "afterend",
        `<span class="author-links" aria-label="Shishir Dey contact links">
          <a class="author-link" href="mailto:shishirdey241097@gmail.com" aria-label="Email Shishir Dey" title="Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </a>
          <a class="author-link" href="https://www.linkedin.com/in/shishir-dey/" target="_blank" rel="noopener noreferrer" aria-label="Shishir Dey on LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V8.98h3.41v1.57h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.29ZM5.32 7.41a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12Zm1.78 13.04H3.54V8.98H7.1v11.47Z"/></svg>
          </a>
          <a class="author-link" href="https://github.com/shishir-dey" target="_blank" rel="noopener noreferrer" aria-label="Shishir Dey on GitHub" title="GitHub">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 3.8c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
        </span>`,
      );
    }

    function syncThemeColor() {
      themeColor.setAttribute("content", getComputedStyle(root).getPropertyValue("--bg-base").trim());
      const targetTheme = root.dataset.theme === "dark" ? "light" : "dark";
      const label = `Switch to ${targetTheme} theme`;
      toggle.setAttribute("aria-label", label);
      toggle.setAttribute("title", label);
    }

    toggle.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = nextTheme;
      syncThemeColor();
    });

    syncThemeColor();
  </script>
</body>
</html>
